<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>CALCULADORA DO VICTOR</h1></header>
    <main>
        <section id="calculadora">
            <div id="visor"><p>0</p></div>
            <div id="botoes" class="botoes">
                <input type="button" value="C" id="btnClear">
                <input type="button" value="←" id="btnVoltar">
                <input type="button" value="÷ " id="btnDividir">
                <input type="button" value="x" id="btnMultiplicar">
                <input type="button" value="7" id="btn7">
                <input type="button" value="8" id="btn8">
                <input type="button" value="9" id="btn9">
                <input type="button" value="-" id="btnDiminuir">
                <input type="button" value="4" id="btn4">
                <input type="button" value="5" id="btn5"> 
                <input type="button" value="6" id="btn6">
                <input type="button" value="+" id="btnSomar">
                <input type="button" value="1" id="btn1">
                <input type="button" value="2" id="btn2">
                <input type="button" value="3" id="btn3">
                <input type="button" value="=" id="btnIgual">
                <input type="button" value="0" id="btn0">
                <input type="button" value="." id="btnPonto">
            </div>
        </section>
    </main>
    <hr>
    <footer>
        <p>&copy; Victor Luan</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
